# Regenerates the App Store screenshots in screenshots/, suffixed with the new minor version
# (e.g. contacts-8.10.png), and points the <screenshot> URLs of appinfo/info.xml at them.
#
# Runs on release pull requests against main that bump the version to the first pre-release
# or the final release of a new minor or major version (e.g. 8.10.0-rc.1 or 9.0.0), and commits
# the result to that pull request. Run it manually to open a pull request against any branch.

name: App Store screenshots

on:
  pull_request:
    branches:
      - main
    paths:
      - appinfo/info.xml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest-low
    # The bot token is never available to pull requests from forks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      run: ${{ steps.check.outputs.run }}
      php-max: ${{ steps.versions.outputs.php-max }}
      branches-max: ${{ steps.versions.outputs.branches-max }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a new minor or major version
        id: check
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          minor=$(echo "$version" | cut -d. -f1,2)
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            run=true
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.0(-(alpha|beta|rc)\.1)?$ ]] && ! grep -qF -- "-$minor.png<" appinfo/info.xml; then
            run=true
          else
            run=false
          fi
          echo "Version $version, refresh screenshots: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

  capture:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.run == 'true'
    steps:
      - name: Set up Nextcloud env
        uses: ChristophWurst/setup-nextcloud@14cf58de73855aa30212721e8177ca45626e4477 # v0.4.2
        with:
          nextcloud-version: ${{ needs.check.outputs.branches-max }}
          php-version: ${{ needs.check.outputs.php-max }}
          install: true

      - name: Configure Nextcloud
        run: |
          php -f nextcloud/occ config:system:set overwriteprotocol --value=https
          php -f nextcloud/occ config:system:set overwritehost --value=localhost
          php -f nextcloud/occ config:system:set overwrite.cli.url --value=https://localhost

      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nextcloud/apps/contacts
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: package-engines-versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11'
          path: nextcloud/apps/contacts

      - name: Set up node ${{ steps.package-engines-versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.package-engines-versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.package-engines-versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.package-engines-versions.outputs.npmVersion }}'

      - name: Install php dependencies
        working-directory: nextcloud/apps/contacts
        run: composer install --no-dev

      - name: Install the app
        run: php -f nextcloud/occ app:enable contacts

      - name: Install npm dependencies
        working-directory: nextcloud/apps/contacts
        run: npm ci

      - name: Build frontend
        working-directory: nextcloud/apps/contacts
        run: npm run build

      - name: Install stunnel (tiny https proxy)
        run: sudo apt-get update && sudo apt-get install -y stunnel

      - name: Start php server and https proxy
        working-directory: nextcloud
        run: |
          openssl req -new -x509 -days 365 -nodes -subj "/C=US/ST=Denial/L=Springfield/O=Dis/CN=localhost" -out stunnel.pem -keyout stunnel.pem
          php -S 127.0.0.1:8080 &
          sudo stunnel3 -p stunnel.pem -d 443 -r 8080

      - name: Install Playwright browsers
        working-directory: nextcloud/apps/contacts
        run: npx playwright install --with-deps chromium

      - name: Take screenshots
        working-directory: nextcloud/apps/contacts
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshots
          path: |
            nextcloud/apps/contacts/screenshots/
            nextcloud/apps/contacts/appinfo/info.xml
            nextcloud/apps/contacts/README.md
          retention-days: 14

      - name: Print server logs
        if: failure()
        run: cat nextcloud/data/nextcloud.log*
    env:
      CI: true

  # Kept apart from the capture job so the bot token is never exposed to code built from the branch
  commit:
    runs-on: ubuntu-latest-low
    needs: [check, capture]
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.COMMAND_BOT_PAT }}

      # The artifact holds only the current version, so older screenshots get deleted
      - name: Remove current screenshots
        run: rm -rf screenshots

      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots

      - name: Commit to the pull request
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'nextcloud-command'
          git config user.email 'nextcloud-command@users.noreply.github.com'
          git add screenshots appinfo/info.xml README.md
          git diff --cached --quiet && exit 0
          git commit --signoff -m 'docs(appinfo): refresh App Store screenshots'
          git push

      - name: Create pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          commit-message: 'docs(appinfo): refresh App Store screenshots'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          branch: automated/noid/${{ github.ref_name }}-screenshots
          title: '[${{ github.ref_name }}] Refresh App Store screenshots'
          body: Screenshots generated by `npm run screenshots` against Nextcloud ${{ needs.check.outputs.branches-max }}.
          labels: |
            3. to review
